    <text class="mono ds" x="36" y="90" fill="#7A7D86">Budget allocation for payment recovery</text>
    <text class="mono tc" y="120" fill="#5C5E67"><tspan x="36">Python</tspan><tspan x="106">Optimization</tspan><tspan x="215">Analytics</tspan><tspan x="304">Machine Learning</tspan></text>

    <rect x="36" y="136" width="106" height="22" rx="6" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".09"/>
    <text class="mono cp" x="48" y="151" fill="#8A8F98">Project work</text>

    <rect x="0.5" y="0.5" width="999" height="189" rx="17.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
