<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-label="Task-Driven Super-Resolution. Beyond perceptual quality for diagnostic X-rays. Python, deep learning, super-resolution, chest X-ray. Research project.">
