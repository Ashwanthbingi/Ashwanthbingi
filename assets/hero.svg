<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Ashwanth Bingi, computer science engineering">
  <title>Ashwanth Bingi — Computer Science Engineering</title>

  <defs>
    <style>
      .sans { font-family: "SF Pro Display","Helvetica Neue","Segoe UI Variable Display","Segoe UI",Inter,system-ui,-apple-system,sans-serif; }
      .mono { font-family: "SF Mono",ui-monospace,"JetBrains Mono","Cascadia Mono","DejaVu Sans Mono",Consolas,monospace; }

      .name   { font-size: 62px; font-weight: 300; letter-spacing: 10px; }
      .kicker { font-size: 13px; font-weight: 400; letter-spacing: 4.6px; }
      .role   { font-size: 14.5px; font-weight: 400; letter-spacing: 0.6px; }
      .url    { font-size: 11px; letter-spacing: 1.6px; }

      .glyph  { fill: none; stroke: #C9CBD4; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .glyphf { fill: #C9CBD4; stroke: none; }

      .float1 { animation: fl 13s ease-in-out infinite; }
      .float2 { animation: fl 17s ease-in-out infinite -3s; }
      .float3 { animation: fl 21s ease-in-out infinite -7s; }
      .float4 { animation: fl 15s ease-in-out infinite -11s; }
      @keyframes fl { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-13px); } }

      .grid  { animation: gd 24s linear infinite; }
      @keyframes gd { from { transform: translate(0px,0px); } to { transform: translate(48px,48px); } }

      .auroraA { animation: aa 19s ease-in-out infinite; transform-origin: 340px 150px; }
      .auroraB { animation: ab 23s ease-in-out infinite; transform-origin: 880px 300px; }
      @keyframes aa { 0%,100% { transform: scale(1) translateX(0px); opacity:.85 } 50% { transform: scale(1.18) translateX(60px); opacity:1 } }
      @keyframes ab { 0%,100% { transform: scale(1.12) translateX(0px); opacity:1 } 50% { transform: scale(.94) translateX(-70px); opacity:.8 } }

      .sweep { animation: sw 9s cubic-bezier(.4,0,.2,1) infinite; }
      @keyframes sw { 0% { transform: translateX(0px); } 48%,100% { transform: translateX(1760px); } }

      .rule { animation: rl 9s ease-in-out infinite; }
      @keyframes rl { 0%,100% { opacity:.55 } 50% { opacity:1 } }

      @media (prefers-reduced-motion: reduce) {
        .float1,.float2,.float3,.float4,.grid,.auroraA,.auroraB,.sweep,.rule { animation: none; }
      }
    </style>

    <clipPath id="panel"><rect x="0" y="0" width="1200" height="420" rx="26"/></clipPath>

    <radialGradient id="gA" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#6679FF" stop-opacity=".20"/>
      <stop offset="55%"  stop-color="#3A45A8" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#1C2050" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gB" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3C4A8C" stop-opacity=".14"/>
      <stop offset="60%"  stop-color="#232A52" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#14183A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gW" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".055"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="46%" r="68%">
      <stop offset="55%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".72"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <mask id="sheenMask">
      <rect x="0" y="0" width="1200" height="420" fill="#000000"/>
      <g class="sweep"><rect x="-360" y="0" width="360" height="420" fill="url(#sheenGrad)"/></g>
    </mask>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="d"/>
      <feComponentTransfer in="d"><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
    </filter>

    <g id="gBraces">
      <path class="glyph" d="M-9 -16 q-8 0 -8 8 v6 q0 4 -5 4 q5 0 5 4 v6 q0 8 8 8"/>
      <path class="glyph" d="M9 -16 q8 0 8 8 v6 q0 4 5 4 q-5 0 -5 4 v6 q0 8 -8 8"/>
    </g>
    <g id="gDatabase">
      <ellipse class="glyph" cx="0" cy="-13" rx="16" ry="6"/>
      <path class="glyph" d="M-16 -13 v12 q0 6 16 6 q16 0 16 -6 v-12"/>
      <path class="glyph" d="M-16 1 v12 q0 6 16 6 q16 0 16 -6 v-12"/>
    </g>
    <g id="gShield">
      <path class="glyph" d="M0 -18 L15 -11 v10 q0 12 -15 19 q-15 -7 -15 -19 v-10 Z"/>
      <path class="glyph" d="M-6 -1 l4.5 5 L7 -6"/>
    </g>
    <g id="gGit">
      <circle class="glyph" cx="-11" cy="-14" r="4"/>
      <circle class="glyph" cx="-11" cy="15" r="4"/>
      <circle class="glyph" cx="12" cy="0" r="4"/>
      <path class="glyph" d="M-11 -10 v21"/>
      <path class="glyph" d="M-11 -2 q0 -9 9 -9 q4 0 8 5"/>
    </g>
    <g id="gNeural">
      <path class="glyph" d="M-13 -13 L3 -9 M-13 -13 L3 3 M-13 2 L3 -9 M-13 2 L3 3 M-13 15 L3 3 M3 -9 L16 -3 M3 3 L16 -3"/>
      <circle class="glyphf" cx="-13" cy="-13" r="2.6"/>
      <circle class="glyphf" cx="-13" cy="2" r="2.6"/>
      <circle class="glyphf" cx="-13" cy="15" r="2.6"/>
      <circle class="glyphf" cx="3" cy="-9" r="2.6"/>
      <circle class="glyphf" cx="3" cy="3" r="2.6"/>
      <circle class="glyphf" cx="16" cy="-3" r="2.6"/>
    </g>
    <g id="gChip">
      <rect class="glyph" x="-11" y="-11" width="22" height="22" rx="3"/>
      <rect class="glyph" x="-4" y="-4" width="8" height="8" rx="1.5"/>
      <path class="glyph" d="M-6 -11 v-6 M0 -11 v-6 M6 -11 v-6 M-6 11 v6 M0 11 v6 M6 11 v6 M-11 -6 h-6 M-11 0 h-6 M-11 6 h-6 M11 -6 h6 M11 0 h6 M11 6 h6"/>
    </g>
    <g id="gLeaf">
      <path class="glyph" d="M16 -16 q4 22 -8 30 q-12 8 -20 0 q-8 -8 0 -18 q8 -10 28 -12 Z"/>
      <path class="glyph" d="M13 -13 q-16 10 -22 24"/>
    </g>
    <g id="gCup">
      <path class="glyph" d="M-13 -4 h22 v10 q0 9 -11 9 q-11 0 -11 -9 Z"/>
      <path class="glyph" d="M9 -1 h4 q5 0 5 5 q0 5 -5 5 h-4"/>
      <path class="glyph" d="M-5 -12 q4 -4 0 -8 M3 -12 q4 -4 0 -8"/>
      <path class="glyph" d="M-15 21 h26"/>
    </g>
    <g id="gTerm">
      <rect class="glyph" x="-18" y="-13" width="36" height="26" rx="4"/>
      <path class="glyph" d="M-18 -5 h36"/>
      <circle class="glyphf" cx="-12.5" cy="-9" r="1.5"/>
      <circle class="glyphf" cx="-7.5" cy="-9" r="1.5"/>
      <circle class="glyphf" cx="-2.5" cy="-9" r="1.5"/>
      <path class="glyph" d="M-12 1 l5 4 l-5 4 M-1 9 h10"/>
    </g>
    <g id="gCube">
      <path class="glyph" d="M0 -17 L15 -8.5 v17 L0 17 L-15 8.5 v-17 Z"/>
      <path class="glyph" d="M0 -17 L0 0 L15 -8.5 M0 0 L-15 -8.5 M0 0 v17"/>
    </g>
  </defs>

  <g clip-path="url(#panel)">
    <rect x="0" y="0" width="1200" height="420" fill="#050506"/>

    <g class="auroraA"><ellipse cx="340" cy="150" rx="420" ry="230" fill="url(#gA)"/></g>
    <g class="auroraB"><ellipse cx="880" cy="300" rx="430" ry="210" fill="url(#gB)"/></g>
    <ellipse cx="600" cy="214" rx="470" ry="190" fill="url(#gW)"/>

    <g opacity=".07" stroke="#FFFFFF" stroke-width="1">
      <g class="grid">
        <path d="M0 0 H1296 M0 48 H1296 M0 96 H1296 M0 144 H1296 M0 192 H1296 M0 240 H1296 M0 288 H1296 M0 336 H1296 M0 384 H1296 M0 432 H1296" transform="translate(-48,-48)"/>
        <path d="M0 0 V468 M48 0 V468 M96 0 V468 M144 0 V468 M192 0 V468 M240 0 V468 M288 0 V468 M336 0 V468 M384 0 V468 M432 0 V468 M480 0 V468 M528 0 V468 M576 0 V468 M624 0 V468 M672 0 V468 M720 0 V468 M768 0 V468 M816 0 V468 M864 0 V468 M912 0 V468 M960 0 V468 M1008 0 V468 M1056 0 V468 M1104 0 V468 M1152 0 V468 M1200 0 V468 M1248 0 V468" transform="translate(-48,-48)"/>
      </g>
    </g>

    <rect x="0" y="0" width="1200" height="420" fill="url(#vig)"/>
    <rect x="0" y="0" width="1200" height="170" fill="url(#topLight)"/>

    <g transform="translate(80,96)"  opacity=".13"><g class="float1"><use href="#gBraces"/></g></g>
    <g transform="translate(152,200)" opacity=".09"><g class="float3"><use href="#gDatabase"/></g></g>
    <g transform="translate(74,306)"  opacity=".12"><g class="float2"><use href="#gShield"/></g></g>
    <g transform="translate(166,356)" opacity=".075"><g class="float4"><use href="#gGit"/></g></g>
    <g transform="translate(1122,96)" opacity=".13"><g class="float2"><use href="#gNeural"/></g></g>
    <g transform="translate(1048,200)" opacity=".085"><g class="float4"><use href="#gChip"/></g></g>
    <g transform="translate(1128,306)" opacity=".12"><g class="float1"><use href="#gLeaf"/></g></g>
    <g transform="translate(1036,356)" opacity=".075"><g class="float3"><use href="#gCup"/></g></g>
    <g transform="translate(336,62)"  opacity=".08"><g class="float4"><use href="#gTerm"/></g></g>
    <g transform="translate(872,58)"  opacity=".085"><g class="float1"><use href="#gCube"/></g></g>

    <text class="mono url" x="40" y="44" fill="#4C4E57">github.com/Ashwanthbingi</text>

    <text class="sans name" x="600" y="232" fill="#E8E9ED" text-anchor="middle" text-rendering="geometricPrecision">ASHWANTH BINGI</text>
    <g mask="url(#sheenMask)">
      <text class="sans name" x="600" y="232" fill="#FFFFFF" text-anchor="middle" text-rendering="geometricPrecision">ASHWANTH BINGI</text>
    </g>

    <rect class="rule" x="440" y="272" width="320" height="1.3" fill="url(#hair)"/>

    <text class="mono kicker" x="600" y="306" fill="#8A8F98" text-anchor="middle">COMPUTER SCIENCE ENGINEERING</text>
    <text class="sans role"   x="600" y="340" fill="#5C5E67" text-anchor="middle"><tspan>Developer</tspan><tspan dx="24">Builder</tspan><tspan dx="24">Problem&#160;solver</tspan></text>

    <rect x="0" y="0" width="1200" height="420" filter="url(#grain)" opacity=".05" style="mix-blend-mode:overlay"/>
    <rect x="0.5" y="0.5" width="1199" height="419" rx="25.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
  </g>
</svg>
